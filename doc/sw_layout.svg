<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Arial, Helvetica, sans-serif" role="img" aria-label="MAGIA software memory layout: the L2 holds the code, the exit codes and the program data, shared by every tile; the private part of the L1 holds the scratch and the stacks, at the same address in every tile; the global part of the L1 holds the data buffers and the sync words of the tile">
  <style>
    text { fill: #8A8A8A; font-size: 13px; }
    .k  { font-weight: 700; font-size: 14px; }
    .s  { font-size: 12px; }
    .w  { fill: #ffffff; font-weight: 700; }
    .wm { fill: #ffffff; font-family: Menlo, Consolas, monospace; font-size: 11px; font-weight: 400; }
    .m  { font-family: Menlo, Consolas, monospace; font-size: 11px; fill: #333333; }
    .mem  { fill: #1565C0; stroke: #0B3D7A; }
    .memL { fill: #2F86D6; stroke: #1A4F8A; }
    .un   { fill: #ffffff; stroke: #9AA0A6; stroke-dasharray: 4 3; }
  </style>

  <!-- L2: one copy for every tile, contiguous from the start of the L2 -->
  <text class="k" x="20" y="22">L2</text>
  <text class="s" x="20" y="40">one copy for every tile</text>
  <rect class="mem" x="20" y="52" width="260" height="36"/>
  <text class="w" x="32" y="75">control-core code</text>
  <rect class="mem" x="20" y="88" width="260" height="36"/>
  <text class="w" x="32" y="111">Spatz code</text>
  <rect class="mem" x="20" y="124" width="260" height="36"/>
  <text class="w" x="32" y="147">PULP code</text>
  <rect class="un" x="20" y="160" width="260" height="28"/>
  <text class="m" x="32" y="178">free · rest of the 32 KiB of code</text>
  <rect class="mem" x="20" y="188" width="260" height="36"/>
  <text class="w" x="32" y="211">exit codes · 2 B per tile</text>
  <rect class="mem" x="20" y="224" width="260" height="36"/>
  <text class="w" x="32" y="247">.data .rodata .bss</text>
  <rect class="un" x="20" y="260" width="260" height="28"/>
  <text class="m" x="32" y="278">free · rest of the data region</text>
  <rect class="un" x="20" y="288" width="260" height="28"/>
  <text class="m" x="32" y="306">free · rest of the L2</text>

  <!-- L1 private part: same address in every tile, each tile sees its own -->
  <text class="k" x="310" y="22">L1 private part · 128 KiB</text>
  <text class="s" x="310" y="40">same address in every tile, each sees its own</text>
  <rect class="memL" x="310" y="52" width="260" height="112"/>
  <text class="w" x="322" y="104">scratch</text>
  <text class="wm" x="322" y="122">94 KiB</text>
  <rect class="memL" x="310" y="164" width="260" height="56"/>
  <text class="w" x="322" y="188">PULP stacks</text>
  <text class="wm" x="322" y="206">8 cores × 2 KiB</text>
  <rect class="memL" x="310" y="220" width="260" height="40"/>
  <text class="w" x="322" y="236">control-core stack</text>
  <text class="wm" x="322" y="252">2 KiB</text>
  <rect class="memL" x="310" y="260" width="260" height="56"/>
  <text class="w" x="322" y="284">Spatz stack</text>
  <text class="wm" x="322" y="302">16 KiB</text>

  <!-- L1 global part: in the tile window, reachable by every tile -->
  <text class="k" x="600" y="22">L1 global part · 896 KiB</text>
  <text class="s" x="600" y="40">in the tile window, reachable by every tile</text>
  <rect class="memL" x="600" y="52" width="260" height="224"/>
  <text class="w" x="612" y="158">data buffers</text>
  <text class="wm" x="612" y="176">892 KiB</text>
  <rect class="memL" x="600" y="276" width="260" height="40"/>
  <text class="w" x="612" y="292">sync words</text>
  <text class="wm" x="612" y="308">4 KiB</text>
</svg>
