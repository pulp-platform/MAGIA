#
# MAGIA test list, read by scripts/run_regression.py.
#
# Top-level keys are the folders of sw/tests/ (`general` is sw/tests/ itself); each test is named
# as `make test=` expects it. Fields:
#   testbench  mesh or tile
#   cores      control cores the test runs on
#   sims       simulators the test runs on: questa, verilator
#   requires   defines the build must have (MAGIA_FSYNC: FractalSync on)
#   fast_sim   false builds the HW without the fast optimization (default true)
#   timeout    seconds, overrides the default of the testbench

# Tests in sw/tests/ itself
general:
  inter_l1_test:
    testbench: mesh
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  hello_mesh:
    testbench: mesh
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  hetero_mesh_test:
    testbench: mesh
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # Atomics are enabled only by the CV32E40X toolchain
  amo_test:
    testbench: mesh
    cores: [CV32E40X]
    sims: [questa, verilator]
    requires: []
    fast_sim: false
  hello_world:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  fpu_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  boot_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  l1_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # Same results with and without the data cache (make dcache=0|1), only the cycles change
  dcache_sum_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # CoreMark (EEMBC) on the control core, data in the L2 through the cache by default (EXTRA_CFLAGS=-DCOREMARK_MEM=0|1|2)
  coremark_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # Runtime cacheable region, CACHE_EN and WAY_EN (with dcache=0 only the data checks run)
  dcache_runtime_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # 8 cluster cores on the RaiderSTREAM kernels over L2: direct vs iDMA tiles vs cache (MSHR and wide port)
  dcache_stream_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # Break-even iDMA / cache: blocchi di BLOCK parole presi in ordine casuale, da 1 (gather) a N (sequenziale)
  dcache_blocks_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # OBPMark 2.1 CCSDS 121.0 data compression: poco calcolo per byte, blocchi
  obpmark_ccsds121_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # OBPMark 3.1 AES in counter mode (compute bound): L2 direct vs iDMA vs cache
  obpmark_aes_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # RaiderSTREAM kernels (copy, scale, add, triad; sequential, gather, scatter, sg): L2 direct vs iDMA vs cache
  raiderstream_test:
    testbench: tile
    cores: [CV32E40P]
    sims: [questa, verilator]
    requires: []
  # Regular kernel: L2 direct vs iDMA + SPM (double buffered) vs data cache
  dcache_vs_idma_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # Irregular lookups: L2 direct vs data cache vs iDMA of the whole table vs one iDMA per lookup
  dcache_irregular_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []
  # AMOs next to the data cache: on a line not in the cache (checked) and on a dirty line (printed)
  dcache_amo_test:
    testbench: tile
    cores: [CV32E40X]
  # iDMA copy in the background while the core works through the cache: iDMA and core time, prefetch off/on
  dcache_contention_test:
    testbench: tile
    cores: [CV32E40P, CV32E40X]
    sims: [questa, verilator]
    requires: []

