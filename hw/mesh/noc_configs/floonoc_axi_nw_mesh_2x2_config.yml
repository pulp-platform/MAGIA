name: axi_nw_mesh_2x2
description: "Configuration file for a 2x2 MAGIA Mesh NoC"
network_type: "narrow-wide"

routing:
  route_algo: "XY"
  use_id_table: true
  collective:
    en_narrow_multicast: true
    en_wide_multicast: true

protocols:
  - name: "narrow_data_mst"
    type: "narrow"
    protocol: "AXI4"
    data_width: 32
    addr_width: 32
    id_width: 3
    user_width:
      collective_mask: 32
      collective_op: 4
      user: 5
  - name: "narrow_data_slv"
    type: "narrow"
    protocol: "AXI4"
    data_width: 32
    addr_width: 32
    id_width: 6
    user_width:
      collective_mask: 32
      collective_op: 4
      user: 5
  - name: "wide_data_mst"
    type: "wide"
    protocol: "AXI4"
    data_width: 256
    addr_width: 32
    id_width: 2
    user_width:
      collective_mask: 32
      collective_op: 4
  - name: "wide_data_slv"
    type: "wide"
    protocol: "AXI4"
    data_width: 256
    addr_width: 32
    id_width: 2
    user_width:
      collective_mask: 32
      collective_op: 4

endpoints:
  - name: "magia_tile"
    array: [2, 2]
    addr_range:
      base: 0x0000_0000
      size: 0x0010_0000
      en_collective: true
    mgr_port_protocol:
      - "narrow_data_slv"
      - "wide_data_slv"
    sbr_port_protocol:
      - "narrow_data_mst"
      - "wide_data_mst"
  - name: "L2"
    array: [2]
    addr_range:
      base: 0xC000_0000
      size: 0x2000_0000
    sbr_port_protocol:
      - "narrow_data_mst"
      - "wide_data_mst"

routers:
  - name: "router"
    array: [2, 2]
    degree: 5

connections:
  - src: "magia_tile"
    dst: "router"
    src_range:
    - [0, 1]
    - [0, 1]
    dst_range:
    - [0, 1]
    - [0, 1]
    dst_dir: "Eject"
  - src: "L2"
    dst: "router"
    src_range:
    - [0, 1]
    dst_range:
    - [0, 0]
    - [0, 1]
    dst_dir: "West"
