#
# Dependencies (everything checked out by Bender) are held to errors only:
# every WARNING-level rule is waived under .bender/ and pd/ (nonfree
# technology repo). MAGIA's own RTL gets the full rule set. Regenerate the rule list with
#   svguard --list-rules | awk '$2 == "warning" {print $1}'

