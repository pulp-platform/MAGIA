# Technology wrappers instantiate SRAM macros and standard cells, which are
# black boxes to svguard.
[[waiver]]
rule   = "lang.UnknownModule"
file   = "**/pd/sourcecode/tc_*.sv"
reason = "technology hard macros / standard cells, no RTL model"

# MAGIA RTL: specific, reviewed exceptions.
[[waiver]]
rule   = "synth.no-decl-init"
file   = "**/hw/tile/spatz_bootrom.sv"
line   = 21
reason = "bootrom contents are constant (ROM), initialized at declaration by design"

[[waiver]]
rule   = "seq.no-reset"
file   = "**/hw/tile/spatz_bootrom.sv"
line   = 31
reason = "ROM read port: memory, no reset needed"

# Not a real waiver: the error is kept visible as a warning. eu_direct_link is
# connected whole to event_unit_top, whose port is [NB_CORES-1:0]; array ports
# bind by position, so flipping only the MAGIA side would silently reverse the
# core <-> event unit mapping. Needs fixing in event_unit_flex first.
[[waiver]]
rule     = "struct.intf-array-range"
file     = "**/hw/tile/magia_event_unit.sv"
line     = 84
severity = "warning"
reason   = "must match descending port of event_unit_top; fix on event_unit_flex side"

